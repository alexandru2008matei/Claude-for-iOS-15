name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeChat-ipa
          path: ClaudeChat.ipa
